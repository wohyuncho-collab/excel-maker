<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1013">
<title>Barcode Scan</title>
<style>
:root{--bg:#F3F3F0;--card:#fff;--line:#E4E3DD;--text:#0F1013;--mute:#6B6F7A;--acc:#F2551B;--acc-s:#FFEFE8;--ink:#0F1013;--on-ink:#fff;--red:#D92D20;--soft:#F6F5F1;--shadow:0 10px 32px rgba(15,16,19,.14);color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0A0B0E;--card:#14161B;--line:#262A33;--text:#F4F5F7;--mute:#9AA2B0;--acc:#FF7A45;--acc-s:#2B1D16;--ink:#F4F5F7;--on-ink:#0A0B0E;--red:#FF7A70;--soft:#1B1E25;--shadow:0 10px 32px rgba(0,0,0,.5);color-scheme:dark}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:Pretendard,-apple-system,"Noto Sans KR","Apple SD Gothic Neo",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.4;padding:env(safe-area-inset-top) 0 calc(108px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{border:0;cursor:pointer;background:none}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;flex:none}
header h1{font-size:19px;font-weight:800;letter-spacing:-.03em}
header p.cr{letter-spacing:.01em}
.sumrow{max-width:1100px;margin:0 auto;padding:2px 18px 2px;font-size:12px;color:var(--mute)}
header p{font-size:12px;color:var(--mute);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icb{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:var(--card);flex:none}
.icb:active{background:var(--soft)}
main{max-width:1100px;margin:0 auto;padding:6px 14px 14px;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.col{background:var(--card);border:1px solid var(--line);border-radius:22px;display:flex;flex-direction:column;overflow:hidden}
.col-h{display:flex;align-items:center;gap:8px;padding:14px 12px 6px 14px}
.chip{width:30px;height:30px;border-radius:9px;background:var(--acc-s);color:var(--acc);font-weight:800;font-size:13px;display:grid;place-items:center;flex:none}
.col-h input{flex:1;min-width:0;height:40px;border:0;background:transparent;font-size:17px;font-weight:700;letter-spacing:-.02em}
.col-h input::placeholder{color:var(--mute);font-weight:500}
.col-h input:focus,.add input:focus{outline:2px solid var(--acc);outline-offset:1px;border-radius:10px}
.col-h .icb{width:38px;height:38px;border-radius:11px}
.meta{padding:2px 14px 10px;display:flex;justify-content:space-between;align-items:flex-end}
.big{display:flex;align-items:baseline;gap:3px;color:var(--mute);font-size:13px}
.big b{font-size:30px;font-weight:800;color:var(--text);letter-spacing:-.04em;line-height:1}
.mb{display:flex;gap:6px}
.ul{font-size:12px;font-weight:600;color:var(--mute);padding:6px 10px;border-radius:999px;background:var(--soft)}
.ul:active{background:var(--line)}
.add{display:flex;gap:8px;padding:0 12px 12px}
.add input{flex:1;min-width:0;height:46px;border:1px solid var(--line);border-radius:14px;padding:0 14px;background:var(--soft)}
.add input.bad{outline:2px solid var(--red);outline-offset:1px}
.add button{padding:0 18px;border-radius:14px;background:var(--ink);color:var(--on-ink);font-weight:700}
.list{padding:0 8px 6px;max-height:44vh;overflow-y:auto;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:6px;min-height:46px;padding:0 4px 0 8px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .n{width:34px;font-size:11px;font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums}
.row .t{flex:1;text-align:left;padding:12px 0;word-break:break-all;font-weight:500}
.row .x{width:36px;height:36px;border-radius:50%;color:var(--mute);display:grid;place-items:center}
.row .x .ic{width:18px;height:18px}
.row .x:active{background:var(--soft);color:var(--red)}
.row .ph{color:var(--acc)}
.row input{flex:1;height:40px;border:2px solid var(--acc);border-radius:10px;padding:0 10px;background:var(--acc-s)}
.row.new{animation:fl .8s}
@keyframes fl{from{background:var(--acc-s)}to{background:transparent}}
.empty{padding:26px 10px;text-align:center;color:var(--mute);font-size:13px}
.addcol{min-height:64px;border:1.5px dashed var(--line);border-radius:22px;color:var(--mute);font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:6;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:8px;display:flex;gap:6px}
.bar button{flex:1;height:54px;border-radius:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--mute)}
.bar button:active{background:var(--soft)}
.bar .p{background:var(--ink);color:var(--on-ink)}
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;background:var(--ink);color:var(--on-ink);padding:12px 18px;border-radius:999px;font-size:13.5px;font-weight:600;display:none;align-items:center;gap:12px;max-width:92vw;line-height:1.4;box-shadow:var(--shadow)}
.toast.on{display:flex}
.toast b{color:var(--acc);cursor:pointer}
.sheet{position:fixed;inset:0;z-index:15;background:rgba(10,11,14,.5);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet>div{background:var(--card);width:100%;max-width:900px;max-height:84vh;border-radius:26px 26px 0 0;display:flex;flex-direction:column}
.sheet h2{font-size:17px;font-weight:800;padding:20px 20px 10px;display:flex;justify-content:space-between;letter-spacing:-.02em}
.sheet .sc{overflow:auto;padding:0 14px 12px}
.sheet .close{padding:15px;margin:4px 14px calc(14px + env(safe-area-inset-bottom));border-radius:16px;background:var(--ink);color:var(--on-ink);font-weight:700}
table{border-collapse:collapse;font-size:13px;min-width:100%}
th,td{border:1px solid var(--line);padding:8px 12px;white-space:nowrap;text-align:center}
th{background:var(--ink);color:var(--on-ink)}
td.r,th.r{background:var(--soft);color:var(--mute);font-size:11px;width:34px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 6px;border-bottom:1px solid var(--line);font-weight:600}
.opt.tx{flex-direction:column;align-items:stretch;gap:8px}
.opt input[type=text],.opt select{height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--soft)}
.opt input[type=checkbox]{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.opt input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.opt input[type=checkbox]:checked{background:var(--acc)}
.opt input[type=checkbox]:checked::after{transform:translateX(20px)}
.hint{padding:14px 6px;color:var(--mute);font-size:12.5px;line-height:1.55}
.phb{display:flex;gap:8px;padding:10px 14px}
.phb button{flex:1;height:48px;border-radius:14px;background:var(--soft);border:1px solid var(--line);font-weight:700}
.scanSheet>div{max-height:92vh}
#reader{position:relative;width:100%;background:#000;border-radius:14px;overflow:hidden}
#reader::after{content:"";position:absolute;left:4%;right:4%;top:28%;bottom:28%;border:2px solid rgba(255,255,255,.92);border-radius:16px;pointer-events:none;box-shadow:0 0 0 9999px rgba(0,0,0,.28)}
.scan-hint{padding:10px 14px;font-size:12px;color:var(--mute);text-align:center}
html.scan{color-scheme:normal!important;background:transparent!important}
body.barcode-scanner-active{visibility:hidden;background:transparent!important}
#nScan{display:none;position:fixed;inset:0;z-index:50;flex-direction:column;justify-content:space-between;visibility:hidden}
body.barcode-scanner-active #nScan{display:flex;visibility:visible}
body.barcode-scanner-active #nScan *{visibility:visible}
.nTop,.nBot{background:rgba(8,9,12,.68);color:#fff;padding:12px 14px}
.nTop{padding-top:calc(12px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;font-weight:700}
.nBot{padding-bottom:calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
#nStatus{font-size:14px;min-height:20px;word-break:break-all}
.nBtns{display:flex;gap:8px}
.nBtns button,#nClose{height:44px;padding:0 14px;border-radius:14px;background:rgba(255,255,255,.16);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.nBtns button{flex:1}
.nMid{flex:1;display:flex;align-items:center;justify-content:center}
.nBox{position:relative;width:95%;height:34%;border:2px solid rgba(255,255,255,.92);border-radius:16px}
.nBox::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:2px;background:#FF5B1F}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-bars" viewBox="0 0 24 24"><path d="M5 5v14M9 5v14M16 5v14M19 5v14" stroke-width="1.7"/><path d="M12.5 5v14" stroke-width="3"/></symbol>
<symbol id="i-tune" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
<symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V7a2 2 0 0 1 2-2h8"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14"/></symbol>
<symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V4m0 0L8 8m4-4l4 4M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></symbol>
<symbol id="i-scan" viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M8.5 9v6M12 9v6M15.5 9v6"/></symbol>
<symbol id="i-cam" viewBox="0 0 24 24"><path d="M4 8a2 2 0 0 1 2-2h1.5l1.5-2h6l1.5 2H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8z"/><circle cx="12" cy="13" r="3.5"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="i-img" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4 4 3 3-2 4 3"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3L5 14h6l-1 7 8-11h-6l1-7z"/></symbol>
</defs></svg>
<header>
  <div class="brand"><span class="logo"><svg class="ic"><use href="#i-bars"/></svg></span><div><h1>Barcode Scan</h1><p class="cr">Developed by CWH | 레드서비스</p></div></div>
  <button id="bSet" class="icb" aria-label="설정"><svg class="ic"><use href="#i-tune"/></svg></button>
</header>
<div id="sum" class="sumrow"></div>
<main id="app"></main>
<div class="bar">
  <button id="bPrev"><svg class="ic"><use href="#i-eye"/></svg>미리보기</button>
  <button id="bCopy"><svg class="ic"><use href="#i-copy"/></svg>복사</button>
  <button id="bSave"><svg class="ic"><use href="#i-down"/></svg>저장</button>
  <button id="bShare" class="p"><svg class="ic"><use href="#i-share"/></svg>공유</button>
</div>
<div class="toast" id="toast"><span id="tmsg"></span><b id="tundo" hidden>되돌리기</b></div>
<div class="sheet" id="sheet"><div><h2><span>엑셀 미리보기</span></h2><div class="sc" id="pv"></div><button class="close" id="bClose">닫기</button></div></div>
<div class="sheet scanSheet" id="scanSheet"><div><h2 style="display:flex;justify-content:space-between;align-items:center;padding:16px 18px 8px"><span id="scanTitle">바코드 스캔</span><button id="bCloseScan" style="padding:6px 12px;border-radius:8px;background:var(--bg);font-weight:700">닫기</button></h2><div id="reader"></div><div class="scan-hint" id="scanStatus">바코드를 카메라에 가져가면 자동으로 입력됩니다 · 연속 스캔 가능</div></div></div>

<input type="file" id="fPhoto" accept="image/*" capture="environment" hidden>
<div class="sheet" id="setSheet"><div><h2><span>설정</span></h2><div class="sc" id="setBody"></div><button class="close" id="bSetClose">완료</button></div></div>
<div class="sheet" id="phSheet"><div><h2><span id="phCap"></span></h2><div class="sc" style="text-align:center"><img id="phImg" alt="" style="max-width:100%;border-radius:12px"></div><div class="phb"><button id="phShare">공유 · 저장</button><button id="phDel">삭제</button></div><button class="close" id="phClose">닫기</button></div></div>
<div id="nScan"><div class="nTop"><span id="nTitle"></span><button id="nClose"><svg class="ic"><use href="#i-x"/></svg>닫기</button></div><div class="nMid"><div class="nBox"></div></div><div class="nBot"><div id="nStatus"></div><div class="nBtns"><button id="nTorch"><svg class="ic"><use href="#i-bolt"/></svg>조명</button><button data-z="1">1x</button><button data-z="2">2x</button><button data-z="3">3x</button></div></div></div>
<script>addEventListener("error",function(e){var d=document.createElement("div");d.style.cssText="position:fixed;top:0;left:0;right:0;z-index:99;background:#E5484D;color:#fff;padding:8px 12px;font-size:12px";d.textContent="오류: "+e.message+" (줄 "+(e.lineno||"?")+")";document.body.appendChild(d)})</script>
<script>
const KEY='inst_excel_v2', SKEY='inst_excel_snd', CKEY='label_scan_cfg', MAX=12;
const CFG=Object.assign({term:'기관',sort:'asc',dedupe:true,seq:false,prefix:'BarcodeScan',snd:true,vib:true,once:false,photo:true,gap:'1500'},(()=>{try{return JSON.parse(localStorage.getItem('label_scan_cfg'))||{}}catch(e){return {}}})());
const photos=new Set();
if(CFG.prefix==='LabelScan')CFG.prefix='BarcodeScan';
const IC=n=>`<svg class="ic"><use href="#i-${n}"/></svg>`;
let cols=load(), sets=new Map(), editing=null, undoSnap=null, tt, saveT, tact=null, ac, snd=true;
try{snd=localStorage.getItem(SKEY)!=='0'}catch(e){}
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const coll=new Intl.Collator('ko',{numeric:true,sensitivity:'base'});
const sortKo=a=>[...a].sort(coll.compare);
function uid(){return 'c'+Date.now()+Math.random().toString(36).slice(2,6)}

/* ---------- 저장 (0.3초 모아서 1번, 앱을 벗어날 때 즉시) ---------- */
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(d)&&d.length)return d}catch(e){}return [1,2,3].map(()=>({id:uid(),name:'',items:[]}))}
function flush(){clearTimeout(saveT);try{localStorage.setItem(KEY,JSON.stringify(cols))}catch(e){}}
function persist(){clearTimeout(saveT);saveT=setTimeout(flush,300)}
addEventListener('pagehide',flush);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
const setOf=c=>{let s=sets.get(c.id);if(!s){s=new Set(c.items);sets.set(c.id,s)}return s};

/* ---------- 알림 (소리·진동·토스트) ---------- */
function beep(ok){
  try{
    if(CFG.snd){
      ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
      const t=ac.currentTime,seq=ok?[[1400,0,.05]]:[[300,0,.12],[300,.18,.12]];
      for(const [f,d,l] of seq){const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(ac.destination);o.start(t+d);o.stop(t+d+l)}
    }
    if(CFG.vib)vibe(ok);
  }catch(e){}
}
function vibe(ok){
  try{
    const H=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Haptics;
    if(H){H.vibrate({duration:ok?35:80});if(!ok)setTimeout(()=>H.vibrate({duration:80}),170)}
    else if(navigator.vibrate)navigator.vibrate(ok?35:[80,60,80]);
  }catch(e){}
}
const termName=()=>{const t=(CFG.term||'항목').trim()||'항목';return /(명|이름)$/.test(t)?t:t+'명'};
function cfgSave(){try{localStorage.setItem(CKEY,JSON.stringify(CFG))}catch(e){}}
function toast(msg,undo,act){clearTimeout(tt);tact=act||null;$('#tmsg').textContent=msg;$('#tundo').textContent=act?act.label:'되돌리기';$('#tundo').hidden=!(undo||act);$('#toast').classList.add('on');tt=setTimeout(()=>$('#toast').classList.remove('on'),act?7000:undo?4500:2200)}
function snap(){undoSnap=JSON.stringify(cols)}
$('#tundo').onclick=()=>{
  if(tact){const f=tact.fn;tact=null;$('#toast').classList.remove('on');f();return}
  if(undoSnap){cols=JSON.parse(undoSnap);undoSnap=null;sets.clear();persist();renderAll();toast('되돌렸어요')}
};

/* ---------- 화면 (입력창 → 총 개수 → 목록, 최신 항목이 맨 위) ---------- */
const PH=i=>`<button class="x ph" data-act="photo" data-i="${i}" aria-label="사진 보기">${IC('img')}</button>`;
function rowHTML(i,t,isNew,cid){return `<div class="row${isNew?' new':''}"><span class="n">${i+1}</span><button class="t" data-act="start" data-i="${i}">${esc(t)}</button>${cid&&photos.has(cid+'|'+t)?PH(i):''}<button class="x" data-act="del" data-i="${i}" aria-label="삭제">${IC('x')}</button></div>`}
function editHTML(i,t){return `<div class="row"><span class="n">${i+1}</span><input data-act="edit" value="${esc(t)}"></div>`}
function listHTML(c){
  if(!c.items.length)return '<div class="empty">스캔하거나 입력하면 여기에 쌓여요<br>(최신 항목이 맨 위)</div>';
  let h='';for(let i=c.items.length-1;i>=0;i--)h+=editing&&editing.id===c.id&&editing.i===i?editHTML(i,c.items[i]):rowHTML(i,c.items[i],false,c.id);
  return h;
}
function colHTML(c){const L=String.fromCharCode(65+cols.indexOf(c)+(CFG.seq?1:0));return `
  <section class="col" data-id="${c.id}">
    <div class="col-h">
      <span class="chip">${L}</span>
      <input data-act="name" value="${esc(c.name)}" placeholder="${termName()} 입력" enterkeyhint="done">
      <button class="icb" data-act="scan" title="바코드 스캔" aria-label="바코드 스캔">${IC('scan')}</button>
      <button class="icb" data-act="photoscan" title="사진 스캔 (인식하면 자동 촬영·저장)" aria-label="사진 스캔">${IC('cam')}</button>
    </div>
    <div class="meta"><span class="big"><b class="cnt">${c.items.length}</b>개</span><span class="mb"><button class="ul" data-act="undolast">마지막 취소</button><button class="ul" data-act="clear">비우기</button><button class="ul" data-act="delcol">열 삭제</button></span></div>
    <div class="add"><input data-act="add" placeholder="스캔 또는 입력 후 Enter" enterkeyhint="done" autocomplete="off" autocapitalize="off" spellcheck="false"><button data-act="addbtn">추가</button></div>
    <div class="list">${listHTML(c)}</div>
  </section>`}
const VER='v9';
function updateSum(){const t=cols.reduce((a,c)=>a+c.items.length,0);$('#sum').textContent=`${cols.length}개 열 · 총 ${t}개 항목 · 자동 저장됨`}
function renderAll(){app.innerHTML=cols.map(colHTML).join('')+`<button class="addcol" data-act="addcol">${IC('plus')}${esc(CFG.term)} 열 추가</button>`;updateSum()}
function renderCol(id,focusAdd){
  const c=cols.find(x=>x.id===id),old=app.querySelector(`[data-id="${id}"]`);
  if(!c||!old)return renderAll();
  old.outerHTML=colHTML(c);
  const sec=app.querySelector(`[data-id="${id}"]`),ed=sec.querySelector('[data-act=edit]');
  if(ed){ed.focus();ed.select()}else if(focusAdd)sec.querySelector('[data-act=add]').focus();
  updateSum();
}
function flashBad(sec){const i=sec.querySelector('[data-act=add]');i.classList.add('bad');setTimeout(()=>i.classList.remove('bad'),500)}

/* ---------- 입력 (1건이면 새 줄 하나만 추가 → 항목이 많아도 빠름) ---------- */
let lastDupBeep=0;
function addMany(id,raw){
  const c=cols.find(x=>x.id===id);if(!c)return;
  const list=raw.split(/\r?\n|\t/).map(s=>s.trim()).filter(Boolean);if(!list.length)return;
  const S=setOf(c);let added=0,dup=0;
  for(const t of list){if(CFG.dedupe&&S.has(t))dup++;else{S.add(t);c.items.push(t);added++}}
  if(added===1&&list.length===1){
    const sec=app.querySelector(`[data-id="${id}"]`),lst=sec.querySelector('.list'),i=c.items.length-1;
    if(lst.firstElementChild&&lst.firstElementChild.classList.contains('empty'))lst.innerHTML='';
    lst.insertAdjacentHTML('afterbegin',rowHTML(i,c.items[i],true,id));
    lst.scrollTop=0;sec.querySelector('.cnt').textContent=c.items.length;updateSum();
  }else if(added)renderCol(id,true);
  if(added)persist();
  if(dup){const tn=Date.now();if(tn-lastDupBeep>800){lastDupBeep=tn;beep(false)}flashBad(app.querySelector(`[data-id="${id}"]`));toast(list.length===1?`이미 있는 항목: ${list[0]}`:`${added}개 추가 · 중복 ${dup}개 제외`)}
  else if(added){beep(true);if(list.length>1)toast(`${added}개 추가했어요`)}
}

app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,sec=b.closest('.col'),id=sec&&sec.dataset.id,c=cols.find(x=>x.id===id),i=+b.dataset.i;
  if(a==='addcol'){if(cols.length>=MAX)return toast(`최대 ${MAX}개 열까지 가능해요`);cols.push({id:uid(),name:'',items:[]});persist();renderAll();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
  else if(a==='scan'){ openScan(id); }
  else if(a==='photoscan'){forcePhoto=true;openWebScan(id)}
  else if(a==='photo'){showPhoto(id,c.items[i])}
  else if(a==='delcol'){if(cols.length<=1)return toast('최소 1개 열은 필요해요');snap();cols=cols.filter(x=>x.id!==id);sets.delete(id);persist();renderAll();toast('열을 삭제했어요',true)}
  else if(a==='clear'){if(!c.items.length)return;snap();c.items=[];sets.delete(id);persist();renderCol(id);toast('항목을 비웠어요',true)}
  else if(a==='del'){snap();c.items.splice(i,1);sets.delete(id);persist();renderCol(id);toast('삭제했어요',true)}
  else if(a==='undolast'){if(!c.items.length)return toast('취소할 항목이 없어요');const t=c.items.pop();setOf(c).delete(t);persist();renderCol(id,true);toast(`취소: ${t}`)}
  else if(a==='start'){editing={id,i};renderCol(id)}
  else if(a==='addbtn'){const inp=sec.querySelector('[data-act=add]'),v=inp.value;inp.value='';addMany(id,v);inp.focus()}
});
app.addEventListener('input',e=>{if(e.target.dataset.act==='name'){cols.find(x=>x.id===e.target.closest('.col').dataset.id).name=e.target.value;persist()}});
app.addEventListener('keydown',e=>{
  const a=e.target.dataset.act,sec=e.target.closest('.col'),id=sec&&sec.dataset.id;
  if(e.key==='Enter'&&a==='add'){e.preventDefault();const v=e.target.value;e.target.value='';addMany(id,v)}
  if(a==='edit'){if(e.key==='Enter')e.target.blur();if(e.key==='Escape'){editing=null;renderCol(id)}}
});
app.addEventListener('paste',e=>{
  if(e.target.dataset.act!=='add')return;
  const t=(e.clipboardData||window.clipboardData).getData('text');
  if(/[\r\n\t]/.test(t.trim())){e.preventDefault();addMany(e.target.closest('.col').dataset.id,t)}
});
app.addEventListener('focusout',e=>{
  if(e.target.dataset.act!=='edit'||!editing)return;
  const {id,i}=editing,c=cols.find(x=>x.id===id),old=c.items[i],v=e.target.value.trim(),S=setOf(c);editing=null;
  if(!v){snap();c.items.splice(i,1);sets.delete(id);toast('빈 값이라 삭제했어요',true)}
  else if(v!==old&&S.has(v))toast('중복이라 수정하지 않았어요');
  else if(v!==old){S.delete(old);S.add(v);c.items[i]=v}
  persist();renderCol(id);
});

/* ---------- 데이터 → 표 ---------- */
function table(){
  const heads=cols.map(c=>c.name.trim()||termName());
  const srt=a=>CFG.sort==='asc'?sortKo(a):CFG.sort==='desc'?sortKo(a).reverse():a;
  const sorted=cols.map(c=>srt(c.items));let n=0;for(const a of sorted)if(a.length>n)n=a.length;
  const rows=[];for(let r=0;r<n;r++)rows.push(sorted.map(a=>a[r]||''));
  if(CFG.seq){heads.unshift('순번');rows.forEach((r,k)=>r.unshift(String(k+1)))}
  return {heads,rows};
}
const tsv=()=>{const {heads,rows}=table();return [heads,...rows].map(r=>r.join('\t')).join('\n')};
const stamp=()=>new Date().toISOString().slice(0,10);

/* ---------- 순수 JS xlsx 생성 (라이브러리 불필요, WebView 호환) ---------- */
const crcT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c}return t})();
const crc=b=>{let c=-1;for(const x of b)c=crcT[(c^x)&255]^(c>>>8);return(c^-1)>>>0};
function zip(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  for(const [name,txt] of Object.entries(files)){
    const nb=enc.encode(name),d=enc.encode(txt),c=crc(d);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);
    h.setUint32(14,c,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nb.length,true);
    parts.push(new Uint8Array(h.buffer),nb,d);
    const g=new DataView(new ArrayBuffer(46));
    g.setUint32(0,0x02014b50,true);g.setUint16(4,20,true);g.setUint16(6,20,true);g.setUint16(8,0x0800,true);g.setUint16(14,0x21,true);
    g.setUint32(16,c,true);g.setUint32(20,d.length,true);g.setUint32(24,d.length,true);g.setUint16(28,nb.length,true);g.setUint32(42,off,true);
    cen.push(new Uint8Array(g.buffer),nb);
    off+=30+nb.length+d.length;
  }
  const n=Object.keys(files).length,cs=cen.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,n,true);e.setUint16(10,n,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cen,new Uint8Array(e.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function xlsx(){
  const {heads,rows}=table(),X=v=>String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const L=i=>String.fromCharCode(65+i),H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  // 스타일: 1=제목(굵은 테두리·진한 배경) 2=데이터(얇은 테두리) 3=데이터 줄무늬. 빈 칸도 테두리를 그려 표가 깔끔하게 닫힘
  const cell=(v,r,i,st)=>v===''?`<c r="${L(i)}${r}" s="${st}"/>`:`<c r="${L(i)}${r}" t="inlineStr" s="${st}"><is><t>${X(v)}</t></is></c>`;
  const width=heads.map((h,i)=>{let m=h.length*1.6;for(const r of rows){const l=String(r[i]).length;if(l>m)m=l}return Math.min(50,Math.max(14,m+4))});
  const body=rows.map((r,k)=>`<row r="${k+2}">${r.map((v,i)=>cell(v,k+2,i,k%2?3:2)).join('')}</row>`).join('');
  const nm=((CFG.term||'항목').replace(/[\[\]:*?\/\\]/g,'').slice(0,20)||'항목')+'별 목록';
  const sheet=H+`<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0" showGridLines="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${width.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData><row r="1" ht="28" customHeight="1">${heads.map((h,i)=>cell(h,1,i,1)).join('')}</row>${body}</sheetData></worksheet>`;
  const bd=(st,c)=>['left','right','top','bottom'].map(k=>`<${k} style="${st}"><color rgb="${c}"/></${k}>`).join('')+'<diagonal/>';
  const al='<alignment horizontal="center" vertical="center"/>';
  const styles=H+`<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Malgun Gothic"/></font><font><b/><sz val="12"/><color rgb="FFFFFFFF"/><name val="Malgun Gothic"/></font></fonts><fills count="4"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF1F2937"/><bgColor indexed="64"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFF1F5F9"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="3"><border><left/><right/><top/><bottom/><diagonal/></border><border>${bd('thin','FF475569')}</border><border>${bd('medium','FF0F172A')}</border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="4"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="49" fontId="1" fillId="2" borderId="2" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1">${al}</xf><xf numFmtId="49" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1" applyAlignment="1">${al}</xf><xf numFmtId="49" fontId="0" fillId="3" borderId="1" xfId="0" applyNumberFormat="1" applyFill="1" applyBorder="1" applyAlignment="1">${al}</xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  return zip({
    '[Content_Types].xml':H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>',
    '_rels/.rels':H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>',
    'xl/workbook.xml':H+`<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${X(nm)}" sheetId="1" r:id="rId1"/></sheets></workbook>`,
    'xl/_rels/workbook.xml.rels':H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>',
    'xl/styles.xml':styles,
    'xl/worksheets/sheet1.xml':sheet
  });
}

/* ---------- 내보내기 (브라우저 / PWA / Capacitor / 커스텀 WebView 브리지) ---------- */
function build(){
  const {rows}=table();
  if(!rows.length){toast('내보낼 데이터가 없어요');return null}
  return {blob:xlsx(),name:`${(CFG.prefix||'BarcodeScan').replace(/[\\/:*?"<>|]/g,'')}_${stamp()}.xlsx`};
}
const b64=blob=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.readAsDataURL(blob)});
async function shareText(){
  try{await navigator.share({title:'Barcode Scan',text:tsv()})}
  catch(e){if(e&&e.name!=='AbortError')toast(`텍스트 공유도 실패(${e.name}) → "복사"를 이용해 주세요`)}
}
async function share(){
  const f=build();if(!f)return;
  const T='Barcode Scan';
  try{
    const cap=window.Capacitor&&window.Capacitor.Plugins;
    if(cap&&cap.Filesystem&&cap.Share){            // Capacitor APK
      const r=await cap.Filesystem.writeFile({path:f.name,data:await b64(f.blob),directory:'CACHE'});
      await cap.Share.share({title:T,url:r.uri});return;
    }
    if(window.Android&&window.Android.shareFile){   // 직접 만든 WebView 브리지
      window.Android.shareFile(await b64(f.blob),f.name);return;
    }
  }catch(e){if(!e||e.name!=='AbortError')toast('공유 실패: '+((e&&e.name)||'오류'));return}
  if(!navigator.share){save();toast(`공유 기능 없음(${window.isSecureContext?'이 브라우저 미지원':'HTTPS 아님'}) → 파일로 저장했어요`);return}
  const file=new File([f.blob],f.name,{type:f.blob.type});
  // 사용자 터치 직후 공유는 1번만 시도 (실패 후 재시도하면 NotAllowedError 발생)
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:T})}
    catch(e){if(e&&e.name==='AbortError')return;
      toast(`엑셀 파일 공유가 막혔어요(${(e&&e.name)||'오류'})`,false,{label:'텍스트로 공유',fn:shareText})}
    return;
  }
  try{await navigator.share({title:T,text:tsv()});toast('파일 공유가 안 돼 텍스트로 공유했어요')}
  catch(e){if(e&&e.name==='AbortError')return;
    toast(`공유가 막혔어요(${(e&&e.name)||'오류'})`,false,{label:'파일로 저장',fn:save})}
}
async function save(){
  const f=build();if(!f)return;
  if(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Share)return share();
  if(window.Android&&window.Android.saveFile){window.Android.saveFile(await b64(f.blob),f.name);return}
  const u=URL.createObjectURL(f.blob),a=document.createElement('a');
  a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);
  toast('엑셀 파일을 저장했어요');
}
async function copy(){
  const {rows}=table();if(!rows.length)return toast('복사할 데이터가 없어요');
  try{await navigator.clipboard.writeText(tsv())}catch(e){const t=document.createElement('textarea');t.value=tsv();document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}
  toast('표를 복사했어요 (엑셀·메신저에 붙여넣기)');
}
function preview(){
  const {heads,rows}=table();
  $('#pv').innerHTML=`<table><thead><tr><th class="r">1</th>${heads.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map((r,k)=>`<tr><td class="r">${k+2}</td>${r.map(v=>`<td>${esc(v)||'&nbsp;'}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${heads.length+1}" style="text-align:center;color:var(--mute)">항목이 없어요</td></tr>`}</tbody></table>`;
  $('#sheet').classList.add('on');
}
$('#bShare').onclick=share;$('#bSave').onclick=save;$('#bCopy').onclick=copy;$('#bPrev').onclick=preview;
$('#bClose').onclick=()=>$('#sheet').classList.remove('on');
$('#sheet').onclick=e=>{if(e.target.id==='sheet')e.target.classList.remove('on')};

/* ---------- 바코드 스캔 (연속 스캔) ---------- */
let html5Qr = null, scanColId = null, lastScanned = '', lastTime = 0;
let frames=0;
function openWebScan(colId){
  frames=0;
  if(!document.getElementById('scanFrames'))document.getElementById('scanStatus').insertAdjacentHTML('afterend','<div id="scanFrames" style="font-size:11px;color:var(--mute);padding:2px 0"></div>');
  scanColId = colId; seen.clear();
  const col = cols.find(x=>x.id===colId);
  document.getElementById('scanTitle').textContent = (col&&col.name?col.name:'선택 열') + (forcePhoto?' - 사진 스캔 [자동 저장]':' - 바코드 스캔 [일반 카메라]');
  document.getElementById('scanSheet').classList.add('on');
  document.getElementById('scanStatus').textContent = '카메라 시작 중...';
  loadScanner().then(camCheck).then(()=>{
    const F=window.Html5QrcodeSupportedFormats||{};
    const formats=['QR_CODE','CODE_93','CODE_128','CODE_39','EAN_13','EAN_8','UPC_A','UPC_E','ITF','CODABAR','DATA_MATRIX'].map(k=>F[k]).filter(x=>x!==undefined);
    html5Qr = new Html5Qrcode('reader',{
      formatsToSupport:formats,                              // 흔한 형식만 → 인식 빠르고 정확
      experimentalFeatures:{useBarCodeDetectorIfSupported:true}, // 기기 내장 인식기가 있으면 우선 사용
      verbose:false
    });
    return html5Qr.start(
      { facingMode: 'environment' },
      {
        fps: 15,
        // 인식 영역(qrbox)을 지정하지 않으면 영상 전체를 해독 → 화면과 인식 위치가 어긋날 일이 없음
        videoConstraints:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}}
      },
      onScanSuccess,
      ()=>{frames++;if(frames%10===0){const f=document.getElementById('scanFrames');if(f)f.textContent='해독 시도 '+frames+'회 (숫자가 오르면 카메라는 정상 동작 중)'}}
    );
  }).then(()=>{
    try{html5Qr.applyVideoConstraints({advanced:[{focusMode:'continuous'}]}).catch(()=>{})}catch(e){}
    document.getElementById('scanStatus').textContent = '화면 안에 바코드를 비추면 자동 입력돼요 (10~20cm, 연속 스캔)';
  }).catch(e=>{
    document.getElementById('scanStatus').textContent = camMsg(e);
  });
}
/* 카메라 권한을 먼저 직접 요청 → 권한 창이 확실히 뜨고, 실패 원인도 정확히 구분됨 */
async function camCheck(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw {name:'NoMediaDevices'};
  const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
  st.getTracks().forEach(t=>t.stop());
}
function camMsg(e){
  const t=(e&&(e.name||e.message))||String(e);
  let m;
  if(/LibLoad/.test(t))m='스캐너 라이브러리를 불러오지 못했어요 (인터넷 연결 확인)';
  else if(/NoMediaDevices/.test(t))m='이 환경은 카메라를 지원하지 않아요 (HTTPS 주소나 앱에서 열어 주세요)';
  else if(/NotAllowed|Permission|Security/i.test(t))m='카메라 권한이 거부됐어요. 폰 설정 → 앱 → 이 앱 → 권한 → 카메라를 허용해 주세요';
  else if(/NotFound|Requested device|No camera/i.test(t))m='사용할 카메라를 찾지 못했어요';
  else if(/NotReadable|in use/i.test(t))m='다른 앱이 카메라를 쓰는 중이에요. 닫고 다시 시도해 주세요';
  else m='카메라를 시작하지 못했어요';
  return m+'  [세부: '+t+']';
}
/* 스캐너 라이브러리는 📷를 처음 누를 때만 불러옴 → 초기 화면 표시가 막히지 않음 (앱 내장본 우선, 없으면 CDN) */
function loadScanner(){
  if(window.Html5Qrcode)return Promise.resolve();
  const srcs=['html5-qrcode.min.js','https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js'];
  return srcs.reduce((p,src)=>p.catch(()=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=()=>window.Html5Qrcode?res():rej();s.onerror=rej;document.head.appendChild(s)})),Promise.reject()).catch(()=>{throw {name:'LibLoad'}});
}
function closeScan(){
  if(nativeOn){closeNative();return}
  document.getElementById('scanSheet').classList.remove('on');
  if(html5Qr){
    html5Qr.stop().then(()=>{ html5Qr.clear(); html5Qr=null; }).catch(()=>{ html5Qr=null; });
  }
}
const seen = new Map();
function onScanSuccess(decodedText){
  // 바코드마다 '마지막으로 보인 시각'을 따로 기억 → 여러 바코드가 한 화면에 있어도,
  // 같은 바코드가 계속 보이는 동안은 다시 처리하지 않음 (화면에서 1.5초 벗어났다 돌아와야 새로 인식)
  const now = Date.now(), prev = seen.get(decodedText);
  seen.set(decodedText, now);
  if(seen.size > 300){ for(const [k,t] of seen) if(now - t > 5000) seen.delete(k); }
  if(prev && now - prev < (+CFG.gap||1500)) return;
  const c = cols.find(x=>x.id===scanColId);
  if(!c) return;
  const dup = CFG.dedupe && setOf(c).has(decodedText);
  addMany(scanColId, decodedText);
  if((CFG.photo||forcePhoto) && !nativeOn) snapVideo(scanColId, decodedText);
  if(CFG.once && !dup) setTimeout(closeScan, 350);
  // 입력 순서 유지 · 새 줄만 추가 · 소리/진동/저장 처리
  const msg = (dup?`중복됨: ${decodedText}`:`추가됨: ${decodedText}`) + ` · 총 ${c.items.length}개`;
  document.getElementById('scanStatus').textContent = msg;
  const n = document.getElementById('nStatus'); if(n) n.textContent = msg;
}
/* ===== 네이티브(구글 ML Kit) 스캐너: APK에서만 사용, 실패하면 일반 카메라로 자동 전환 ===== */
const NS=()=>window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.BarcodeScanner;
let nativeOn=false,nativeHandle=null;
let forcePhoto=false;
function openScan(colId){
  forcePhoto=false;
  const B=NS();
  if(!B)return openWebScan(colId);
  openNative(colId,B).catch(()=>{closeNative().finally(()=>{toast('고속 스캐너를 못 켜서 일반 카메라로 전환해요');openWebScan(colId)})});
}
async function openNative(colId,B){
  scanColId=colId; seen.clear();
  const col=cols.find(x=>x.id===colId);
  document.getElementById('nTitle').textContent=(col&&col.name?col.name:'선택 열')+' - 스캔 [고속 스캐너]';
  document.getElementById('nStatus').textContent='화면 안에 바코드를 비추세요 (연속 스캔)';
  const p=await B.requestPermissions();
  if(p.camera!=='granted')throw new Error('권한');
  document.documentElement.classList.add('scan');
  document.body.classList.add('barcode-scanner-active');
  nativeOn=true;
  nativeHandle=await B.addListener('barcodesScanned',ev=>{
    for(const b of (ev.barcodes||[])){const v=String(b.rawValue||b.displayValue||'').trim();if(v)onScanSuccess(v)}
  });
  await B.startScan();
}
async function closeNative(){
  const B=NS();
  nativeOn=false;
  document.body.classList.remove('barcode-scanner-active');
  document.documentElement.classList.remove('scan');
  try{if(nativeHandle)await nativeHandle.remove()}catch(e){}
  nativeHandle=null;
  try{if(B)await B.stopScan()}catch(e){}
}
document.getElementById('nClose').onclick=closeScan;
document.getElementById('nTorch').onclick=async()=>{try{await NS().toggleTorch()}catch(e){toast('이 기기는 조명을 지원하지 않아요')}};
document.querySelectorAll('#nScan [data-z]').forEach(b=>b.onclick=async()=>{try{await NS().setZoomRatio({zoomRatio:+b.dataset.z})}catch(e){}});
document.getElementById('bCloseScan').onclick = closeScan;
document.getElementById('scanSheet').addEventListener('click', e=>{ if(e.target.id==='scanSheet') closeScan(); });

/* 기존 renderAll 이후 */



/* ---------- 사진 저장 (IndexedDB) ---------- */
let photoCol=null,phUrl=null,phKey=null;
const DB={open(){return this.p||(this.p=new Promise((res,rej)=>{const r=indexedDB.open('labelscan',1);r.onupgradeneeded=()=>r.result.createObjectStore('ph');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async run(mode,fn){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction('ph',mode),rq=fn(t.objectStore('ph'));t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error)})},
  set(k,v){return this.run('readwrite',o=>o.put(v,k))},get(k){return this.run('readonly',o=>o.get(k))},del(k){return this.run('readwrite',o=>o.delete(k))},keys(){return this.run('readonly',o=>o.getAllKeys())}};
function loadPhotos(){DB.keys().then(ks=>{(ks||[]).forEach(k=>photos.add(k));if(photos.size)renderAll()}).catch(()=>{})}
const FMTS=()=>{const F=window.Html5QrcodeSupportedFormats||{};return ['QR_CODE','CODE_93','CODE_128','CODE_39','EAN_13','EAN_8','UPC_A','UPC_E','ITF','CODABAR','DATA_MATRIX'].map(k=>F[k]).filter(x=>x!==undefined)};
function markPhoto(cid,text){
  photos.add(cid+'|'+text);
  const sec=app.querySelector(`[data-id="${cid}"]`);if(!sec)return;let n=0;
  for(const r of sec.querySelectorAll('.row')){if(n++>8)break;const t=r.querySelector('.t');if(t&&t.textContent===text&&!r.querySelector('.ph')){r.querySelector('.x:last-child').insertAdjacentHTML('beforebegin',PH(+t.dataset.i));break}}
}
async function savePhoto(cid,text,blob){try{await DB.set(cid+'|'+text,blob);markPhoto(cid,text)}catch(e){toast('사진 저장에 실패했어요')}}
function snapVideo(cid,text){
  const v=document.querySelector('#reader video');if(!v||!v.videoWidth)return;
  const k=Math.min(1,1280/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement('canvas');
  c.width=Math.round(v.videoWidth*k);c.height=Math.round(v.videoHeight*k);c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  c.toBlob(b=>b&&savePhoto(cid,text,b),'image/jpeg',.8);
}
async function shrink(file,max){
  const bmp=await createImageBitmap(file),k=Math.min(1,max/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');
  c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(b=>r(new File([b],'p.jpg',{type:'image/jpeg'})),'image/jpeg',.82));
}
$('#fPhoto').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f||!photoCol)return;
  toast('사진에서 바코드를 읽는 중...');
  try{
    const small=await shrink(f,1600);await loadScanner();
    const el=document.createElement('div');el.id='tmpR';el.style.display='none';document.body.appendChild(el);
    let text=null;
    try{const q=new Html5Qrcode('tmpR',{formatsToSupport:FMTS(),verbose:false});const r=await q.scanFileV2(small,false);text=r&&r.decodedText}catch(_){}
    el.remove();
    if(!text)return toast('바코드를 못 읽었어요. 더 가까이서 또렷하게 다시 찍어 주세요');
    addMany(photoCol,text);
    if(CFG.photo)await savePhoto(photoCol,text,small);
  }catch(err){toast('사진 처리에 실패했어요')}
};
async function showPhoto(cid,text){
  const b=await DB.get(cid+'|'+text);if(!b){photos.delete(cid+'|'+text);return toast('저장된 사진이 없어요')}
  phKey=cid+'|'+text;if(phUrl)URL.revokeObjectURL(phUrl);phUrl=URL.createObjectURL(b);
  $('#phImg').src=phUrl;$('#phCap').textContent=text;$('#phSheet').classList.add('on');
}
async function sendFile(blob,name){
  try{
    const cap=window.Capacitor&&window.Capacitor.Plugins;
    if(cap&&cap.Filesystem&&cap.Share){const r=await cap.Filesystem.writeFile({path:name,data:await b64(blob),directory:'CACHE'});await cap.Share.share({title:'Barcode Scan',url:r.uri});return}
    const f=new File([blob],name,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);
}
$('#phShare').onclick=async()=>{const b=await DB.get(phKey);if(b)sendFile(b,phKey.split('|')[1].replace(/[^\w.-]/g,'_')+'.jpg')};
$('#phDel').onclick=async()=>{await DB.del(phKey);photos.delete(phKey);$('#phSheet').classList.remove('on');renderCol(phKey.split('|')[0]);toast('사진을 삭제했어요')};
$('#phClose').onclick=()=>$('#phSheet').classList.remove('on');

/* ---------- 설정 ---------- */
const OPTS=[
  ['text','term','항목 이름 (엑셀 1행 제목에 사용)',['기관','제품','품목','창고','고객','분류','부품']],
  ['sel','sort','엑셀 정렬',[['asc','오름차순'],['desc','내림차순'],['none','입력 순서 그대로']]],
  ['chk','dedupe','중복 항목 제외'],
  ['sel','gap','재스캔 간격 (같은 바코드)',[['500','0.5초'],['1000','1초'],['1500','1.5초']]],
  ['chk','seq','엑셀에 순번 열 추가'],
  ['text','prefix','엑셀 파일 이름'],
  ['chk','snd','스캔 소리'],['chk','vib','스캔 진동'],
  ['chk','once','스캔 1회 후 카메라 자동 닫기'],
  ['chk','photo','스캔 사진 저장 (일반 카메라·사진 스캔)']
];
function openSet(){
  $('#setBody').innerHTML=OPTS.map(([t,k,l,x])=>t==='chk'?`<label class="opt"><span>${l}</span><input type="checkbox" data-k="${k}"${CFG[k]?' checked':''}></label>`
    :t==='sel'?`<label class="opt"><span>${l}</span><select data-k="${k}">${x.map(([v,n])=>`<option value="${v}"${CFG[k]===v?' selected':''}>${n}</option>`).join('')}</select></label>`
    :`<label class="opt tx"><span>${l}</span><input type="text" data-k="${k}" value="${esc(CFG[k]||'')}"${x?` list="dl_${k}"`:''} autocomplete="off"></label>${x?`<datalist id="dl_${k}">${x.map(v=>`<option value="${v}">`).join('')}</datalist>`:''}`).join('')
    +`<p class="hint">고속 스캐너(ML Kit)는 사진 저장을 지원하지 않아요. 사진이 필요하면 카메라 아이콘(사진 스캔)을 쓰세요.<br>Barcode Scan · Developed by CWH | 레드서비스</p>`;
  $('#setSheet').classList.add('on');
}
$('#setBody').addEventListener('input',e=>{
  const k=e.target.dataset.k;if(!k)return;
  CFG[k]=e.target.type==='checkbox'?e.target.checked:e.target.value;cfgSave();
  if(k==='term')renderAll();if(k==='dedupe')sets.clear();if(k==='snd'&&CFG.snd)beep(true);if(k==='vib'&&CFG.vib)vibe(true);
});
$('#bSet').onclick=openSet;$('#bSetClose').onclick=()=>$('#setSheet').classList.remove('on');
$('#setSheet').onclick=e=>{if(e.target.id==='setSheet')e.target.classList.remove('on')};
$('#phSheet').onclick=e=>{if(e.target.id==='phSheet')e.target.classList.remove('on')};
renderAll();loadPhotos();
</script>
