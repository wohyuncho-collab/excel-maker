name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm install html5-qrcode@2.3.8 --no-save
      - name: 스캐너 라이브러리를 앱에 포함 (오프라인 동작)
        run: |
          cp node_modules/html5-qrcode/html5-qrcode.min.js www/
          ls -l www
      - run: npx cap add android
      - run: cp -r icons/. android/app/src/main/res/
      - name: 카메라 권한 추가
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -n "CAMERA" android/app/src/main/AndroidManifest.xml
      - name: 고속 스캐너(구글 ML Kit) 포함해서 빌드
        id: full
        continue-on-error: true
        run: |
          npm install @capacitor-mlkit/barcode-scanning@6
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: 실패하면 기본 스캐너만으로 다시 빌드
        if: steps.full.outcome == 'failure'
        run: |
          npm uninstall @capacitor-mlkit/barcode-scanning
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew clean assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: barcode_cam-apk
          path: android/app/build/outputs/apk/debug/barcode_cam.apk
